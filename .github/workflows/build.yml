name: build

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          # MSRV must match `rust-version` in the root Cargo.toml.
          - os: ubuntu-latest
            toolchain: "1.85"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}

      # MSRV covers the libraries only: dev-dependencies such as trybuild (rustc 1.88) may need a newer toolchain.
      - name: Build
        run: cargo build --workspace --all-features ${{ matrix.toolchain == 'stable' && '--all-targets' || '' }}

      # Catches errors that only surface without the default feature set,
      # which matters because each format is feature-gated.
      - name: Check with no default features
        run: cargo check --workspace --no-default-features
