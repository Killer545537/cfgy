name: build

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install # reads rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-features --all-targets

      # Catches errors that only surface without the default feature set,
      # which matters because each format is feature-gated.
      - name: Check with no default features
        run: cargo check --workspace --no-default-features

  msrv:
    name: build (msrv)
    runs-on: ubuntu-latest
    # Must match `rust-version` in the root Cargo.toml. Overrides rust-toolchain.toml.
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal

      - uses: Swatinem/rust-cache@v2

      # MSRV covers the libraries only: dev-dependencies such as trybuild (rustc 1.88) may need a newer toolchain.
      - name: Build
        run: cargo build --workspace --all-features

      - name: Check with no default features
        run: cargo check --workspace --no-default-features
