[package]
name = "cfgy-formats"
description = "Feature-gated TOML, JSON, and YAML adapters that lower source text into the cfgy value IR."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
toml = ["dep:toml"]
json = ["dep:serde_json"]
yaml = ["dep:saphyr"]

[dependencies]
cfgy-core.workspace = true
indexmap.workspace = true
toml = { workspace = true, optional = true, features = ["preserve_order"] }
serde_json = { workspace = true, optional = true, features = ["preserve_order", "float_roundtrip"] }
saphyr = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
