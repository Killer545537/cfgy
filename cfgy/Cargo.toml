[package]
name = "cfgy"
description = "Derive config structs from TOML, JSON, or YAML files, with the file checked at compile time and parsed at runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["toml"]
toml = ["cfgy-formats/toml", "cfgy-derive/toml"]
json = ["cfgy-formats/json", "cfgy-derive/json"]
yaml = ["cfgy-formats/yaml", "cfgy-derive/yaml"]

[dependencies]
cfgy-core.workspace = true
cfgy-formats.workspace = true
cfgy-derive.workspace = true

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
