[workspace]
resolver = "3"
members = ["cfgy-core", "cfgy-derive", "cfgy-formats", "cfgy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Killer545537/cfgy"
homepage = "https://github.com/Killer545537/cfgy"
documentation = "https://docs.rs/cfgy"
readme = "README.md"
keywords = ["config", "derive", "macro", "toml", "compile-time"]
categories = ["config", "development-tools::procedural-macro-helpers"]

[workspace.dependencies]
syn = {version   = "3.0.5", features = ["full", "extra-traits"]}
quote = "1.0.47"
proc-macro2 = "1.0.107"

cfgy-core = { path = "cfgy-core", version = "0.1.0" }
cfgy-formats = { path = "cfgy-formats", version = "0.1.0", default-features = false }
cfgy-derive = { path = "cfgy-derive", version = "0.1.0", default-features = false }

indexmap = "2.14.2"
toml = "1.1.6"
serde_json = "1.0.151"
saphyr = "0.0.12"

trybuild = "1.0.121"
proptest = "1.11.0"
prettyplease = "0.3.0"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
